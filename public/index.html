<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F3D2E">
  <title>Barão – Delivery de Pizza</title>
  <meta name="description" content="Peça agora e saboreie! Cardápio da Barão – Delivery de Pizza em Fortaleza.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&family=Pacifico&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/menu.css">
  <link rel="stylesheet" href="/css/cart.css">
  <link rel="modulepreload" href="/shared/pricing.js">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <svg hidden aria-hidden="true" focusable="false">
    <symbol id="ph-pizza" viewBox="0 0 88 88">
      <rect class="ph-bg" width="88" height="88"/>
      <circle class="ph-line" cx="44" cy="44" r="28" fill="none" stroke-width="3"/>
      <circle class="ph-line" cx="44" cy="44" r="22" fill="none" stroke-width="1"/>
      <circle class="ph-fill" cx="36" cy="37" r="4"/>
      <circle class="ph-fill" cx="52" cy="40" r="4"/>
      <circle class="ph-fill" cx="43" cy="53" r="4"/>
      <circle class="ph-fill" cx="56" cy="54" r="3"/>
      <circle class="ph-fill" cx="31" cy="51" r="3"/>
    </symbol>
    <symbol id="ph-drink" viewBox="0 0 88 88">
      <rect class="ph-bg" width="88" height="88"/>
      <path class="ph-line" d="M38 14h12v10l6 10v40a4 4 0 0 1-4 4H36a4 4 0 0 1-4-4V34l6-10z" fill="none" stroke-width="3" stroke-linejoin="round"/>
      <rect class="ph-fill" x="32" y="46" width="24" height="14"/>
      <path class="ph-line" d="M36 20h16" stroke-width="3" stroke-linecap="round"/>
    </symbol>
  </svg>

  <a class="skip-link" href="#menu">Pular para o cardápio</a>

  <header class="site-header">
    <span class="site-header__brand">Pizzaria Barão</span>
    <span class="badge status-badge" id="store-status" role="status">Verificando…</span>
  </header>

  <section class="hero" aria-labelledby="hero-title">
    <p class="hero__welcome">Seja bem-vindo(a)!</p>
    <h1 class="hero__title" id="hero-title">
      <span class="hero__script">Pizzaria</span>
      <span class="hero__name">Barão</span>
    </h1>
    <p class="hero__rule" aria-hidden="true"><span></span><i></i><span></span></p>
    <p class="hero__slogan">Peça agora e saboreie!</p>
  </section>

  <section class="status-banner" id="status-banner" hidden></section>

  <nav class="category-tabs" id="category-tabs" aria-label="Categorias do cardápio"></nav>
  <main id="menu" class="menu" aria-busy="true"></main>

  <div class="cart-bar" id="cart-bar" hidden>
    <button type="button" class="cart-bar__button" id="cart-open" aria-controls="cart-drawer">
      <span id="cart-count">0 itens</span>
      <span>Ver carrinho</span>
      <span class="price" id="cart-total" aria-live="polite">R$ 0,00</span>
    </button>
  </div>

  <dialog id="product-modal" class="modal" aria-labelledby="product-modal-title"></dialog>
  <dialog id="cart-drawer" class="drawer" aria-labelledby="cart-title"></dialog>
  <dialog id="checkout-modal" class="modal modal--full" aria-labelledby="checkout-title"></dialog>
  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>
</body>
</html>
